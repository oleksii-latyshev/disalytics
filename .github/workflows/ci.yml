name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['crates/**']
  pull_request:
    paths-ignore: ['crates/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Third of three places this is pinned — see wasm.yml and deploy.yml. They have to agree, because
  # it is part of the cache key that decides whether the parser is rebuilt here.
  WASM_PACK_VERSION: 0.15.0

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with devEngines.packageManager.version in package.json.
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: check
        run: bun run check

      - name: i18n:check
        run: bun run i18n:check

      - name: errors:check
        run: bun run errors:check

      - name: test
        run: bun run test

      # The parse worker imports the generated glue, so `bun run build` cannot emit the SPA — or
      # the .wasm the §13 smoke test asserts — without pkg/. The key is the parser's own inputs, so
      # a frontend-only commit restores it in seconds and installs no Rust at all. wasm.yml writes
      # the entry on main; the build below is what covers a key nothing has written yet.
      #
      # The key names sources rather than `crates/**` because pkg/ lives under crates/ and is the
      # thing being cached: wasm.yml hashes after building it and this job hashes before, so a
      # `crates/**` key never agrees between the two and every restore misses. A new input outside
      # `crates/*/src` — a build.rs, a non-Rust asset — has to be added here by hand.
      - name: Restore the built parser
        id: parser
        uses: actions/cache@v6
        with:
          path: crates/demo-parser-wasm/pkg
          key: >-
            wasm-pkg-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}-${{
            hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install the pinned Rust toolchain
        if: steps.parser.outputs.cache-hit != 'true'
        run: rustup show active-toolchain

      - name: Cache cargo
        if: steps.parser.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        if: steps.parser.outputs.cache-hit != 'true'
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"
          fi

      - name: wasm:build
        if: steps.parser.outputs.cache-hit != 'true'
        run: bun run wasm:build

      - name: build
        run: bun run build

      # After the build on purpose: this one asks the emitted stylesheet whether a class exists, so
      # it has nothing to read until Tailwind has run.
      - name: tokens:check
        run: bun run tokens:check

      - name: size
        run: bun run size
