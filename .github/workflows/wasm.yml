name: wasm

# The pull_request trigger carries no path filter, for the reason ci.yml states at the same place:
# a workflow skipped by a path filter never creates its check run, so a required context stays
# pending for ever, while a job skipped by an `if` reports success. The filter is the `scope` job.
on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'vendor/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/wasm.yml'
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the wasm-pack the repository was verified against.
  WASM_PACK_VERSION: 0.15.0

jobs:
  # The `paths` list above, restated for pull requests in the one grammar that can be read without a
  # checkout. Keep the two saying the same thing.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Decide whether this pull request touches the parser
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --paginate --jq '.[].filename')
          # `case` rather than a regular expression, so the patterns below are the same grammar as
          # the `paths` list above and can be compared to it by eye.
          run=false
          while IFS= read -r file; do
            case "$file" in
              crates/* | vendor/*) run=true ;;
              Cargo.toml | Cargo.lock | rust-toolchain.toml) run=true ;;
              .github/workflows/wasm.yml) run=true ;;
            esac
          done <<EOF
          $files
          EOF
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = 'false' ]; then
            echo 'No Rust in this pull request — ci.yml is what covers it.' >> "$GITHUB_STEP_SUMMARY"
          fi

  wasm:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with devEngines.packageManager.version in package.json.
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Both parity checks run here as well as in ci.yml, because neither workflow sees both halves
      # of either contract on its own: a change to the Rust side alone never reaches the copy that
      # runs there — ci.yml's own scope job skips a parser-only pull request.
      - name: errors:check
        run: bun run errors:check

      - name: bitfields:check
        run: bun run bitfields:check

      # rustup reads rust-toolchain.toml, so the channel, components and wasm target all come from
      # the pinned file rather than from whatever the runner image ships.
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: wasm-pack-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}

      # Named packages, not `--all`: cargo-fmt's `--all` reaches into local path dependencies, and
      # `vendor/` is upstream code this repository does not format. Add a crate here when one
      # arrives under `crates/`.
      - name: fmt
        run: cargo fmt --package demo-parser --package demo-parser-wasm --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"
          fi

      - name: wasm:build
        run: bun run wasm:build

      # Weighing the artifact cannot tell a working binary from one whose entry point traps and
      # whose parser the optimiser then deleted — docs/PARSER.md §8. So the size gate runs after a
      # call into the binary has succeeded, never instead of one.
      - name: wasm:smoke
        run: bun run wasm:smoke

      - name: size
        run: bun run size --wasm

      # ci.yml and deploy.yml restore this rather than installing a Rust toolchain of their own.
      # Written here because ci.yml carries paths-ignore: crates/**, so a parser-only push to main
      # never reaches the copy of this key that a later frontend pull request wants to hit. Saving
      # a key that already exists is a warning, not a failure.
      #
      # This step runs after pkg/ has been built, so the key must not hash anything under it — see
      # the longer note in ci.yml. Keep all three copies of this expression identical.
      - name: Save the built parser for the frontend workflows
        uses: actions/cache/save@v6
        with:
          path: crates/demo-parser-wasm/pkg
          key: >-
            wasm-pkg-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}-${{
            hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
