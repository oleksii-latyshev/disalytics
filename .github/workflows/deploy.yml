name: deploy

# workflow_run is what keeps this strictly downstream of a green `ci`. It is also read only from
# the default branch, so this file cannot be exercised on a feature branch — only after it merges.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

jobs:
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A `push` run on main is the one case where the workflow_run job's own commit is the deployed
    # commit, so a job-level environment records the deployment against the right SHA. GitHub opens
    # it when the job starts and closes it with the job's conclusion, which is what makes a failed
    # smoke test land as a failed deployment rather than a healthy one.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with devEngines.packageManager.version in package.json.
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy

      - name: smoke
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYED_URL" ]; then
            echo "wrangler-action returned no deployment-url; nothing to smoke test." >&2
            exit 1
          fi
          bun run smoke "$DEPLOYED_URL"
