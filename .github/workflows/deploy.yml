name: deploy

# workflow_run is what keeps this strictly downstream of a green `ci`. It is also read only from
# the default branch, so this file cannot be exercised on a feature branch — only after it merges.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

jobs:
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with devEngines.packageManager.version in package.json.
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy

      - name: smoke
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYED_URL" ]; then
            echo "wrangler-action returned no deployment-url; nothing to smoke test." >&2
            exit 1
          fi
          bun run smoke "$DEPLOYED_URL"

  preview:
    # A fork's pull request must never reach the production API token: workflow_run hands secrets
    # to code that CI has only linted, not vetted.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: deploy-preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with devEngines.packageManager.version in package.json.
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: upload version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: versions upload

      - name: smoke
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "wrangler-action returned no deployment-url; nothing to smoke test." >&2
            exit 1
          fi
          bun run smoke "$PREVIEW_URL"

      - name: comment the preview url
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No pull request is associated with ${HEAD_SHA}."
            exit 0
          fi
          gh pr comment "$number" --edit-last --create-if-none --body "Preview: ${PREVIEW_URL}

          Uploaded from \`${HEAD_SHA}\` as a new version. Production stays on the last \`main\` deploy until this merges."
