name: deploy

# workflow_run is what keeps this strictly downstream of a green `ci`. It is also read only from
# the default branch, so this file cannot be exercised on a feature branch — only after it merges.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions:
  contents: read

jobs:
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A `push` run on main is the one case where the workflow_run job's own commit is the deployed
    # commit, so a job-level environment records the deployment against the right SHA. GitHub opens
    # it when the job starts and closes it with the job's conclusion, which is what makes a failed
    # smoke test land as a failed deployment rather than a healthy one.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with devEngines.packageManager.version in package.json.
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy

      - name: smoke
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYED_URL" ]; then
            echo "wrangler-action returned no deployment-url; nothing to smoke test." >&2
            exit 1
          fi
          bun run smoke "$DEPLOYED_URL"

  preview:
    # A fork's pull request must never reach the production API token: workflow_run hands secrets
    # to code that CI has only linted, not vetted.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    concurrency:
      group: deploy-preview-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: true
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Production's job-level `environment:` would be wrong here. A workflow_run job runs at the
      # default branch's head, not at the commit that triggered it, so the deployment would be
      # recorded against main — invisible on the pull request, and a lie about what main is running.
      # The Deployments API is the only way to name the pull request's own head_sha. Do not
      # "simplify" this into an `environment:` block.
      - name: open the preview deployment
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # auto_merge off and required_contexts empty, or the API answers 202/409 with no
          # deployment instead of creating one.
          id=$(jq -n --arg ref "$HEAD_SHA" '{
            ref: $ref,
            environment: "preview",
            description: "wrangler versions upload",
            auto_merge: false,
            required_contexts: [],
            transient_environment: true,
            production_environment: false
          }' | gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments" --input - --jq '.id')
          if [ -z "$id" ]; then
            echo "The Deployments API created no deployment for ${HEAD_SHA}." >&2
            exit 1
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" \
            -f state=in_progress -f log_url="$RUN_URL" >/dev/null

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with devEngines.packageManager.version in package.json.
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: build
        run: bun run build

      - name: upload version
        id: upload
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: versions upload

      - name: smoke
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "wrangler-action returned no deployment-url; nothing to smoke test." >&2
            exit 1
          fi
          bun run smoke "$PREVIEW_URL"

      - name: comment the preview url
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PREVIEW_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          number=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "No pull request is associated with ${HEAD_SHA}."
            exit 0
          fi
          gh pr comment "$number" --edit-last --create-if-none --body "Preview: ${PREVIEW_URL}

          Uploaded from \`${HEAD_SHA}\` as a new version. Production stays on the last \`main\` deploy until this merges."

      - name: close the preview deployment
        if: always() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          PREVIEW_URL: ${{ steps.upload.outputs.deployment-url }}
        run: |
          case "$JOB_STATUS" in
            success) state=success ;;
            # Concurrency cancels the previous upload when a branch is pushed again. Superseded is
            # not broken, so it must not read as a failed deployment on the pull request.
            cancelled) state=inactive ;;
            *) state=failure ;;
          esac
          jq -n --arg state "$state" --arg log "$RUN_URL" --arg url "$PREVIEW_URL" \
            '{ state: $state, log_url: $log }
             + (if $state == "success" and $url != "" then { environment_url: $url } else {} end)' |
            gh api --method POST "repos/${GITHUB_REPOSITORY}/deployments/${DEPLOYMENT_ID}/statuses" \
              --input - >/dev/null
