name: deploy

# workflow_run is what keeps this strictly downstream of a green pipeline. It is also read only
# from the default branch, so this file cannot be exercised on a feature branch — only after it
# merges.
#
# `wasm` is here as well as `ci` because ci.yml carries paths-ignore: crates/**. Without it a
# parser-only commit would green `wasm`, never run `ci`, and never reach production — the parser
# would ship only on the next unrelated frontend commit. A commit that touches both runs both and
# deploys the same SHA twice; the concurrency group below serialises that rather than racing it.
on:
  workflow_run:
    workflows: [ci, wasm]
    types: [completed]

permissions:
  contents: read

env:
  # Keep in step with wasm.yml and ci.yml — it is part of the cache key below.
  WASM_PACK_VERSION: 0.15.0

jobs:
  production:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A `push` run on main is the one case where the workflow_run job's own commit is the deployed
    # commit, so a job-level environment records the deployment against the right SHA. GitHub opens
    # it when the job starts and closes it with the job's conclusion, which is what makes a failed
    # smoke test land as a failed deployment rather than a healthy one.
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with devEngines.packageManager.version in package.json.
          bun-version: 1.3.13

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Same restore-or-build as ci.yml: the SPA does not emit the .wasm without pkg/, and this
      # rebuilds from the deployed commit rather than trusting whatever ci.yml happened to hold.
      - name: Restore the built parser
        id: parser
        uses: actions/cache@v6
        with:
          path: crates/demo-parser-wasm/pkg
          key: >-
            wasm-pkg-${{ runner.os }}-${{ env.WASM_PACK_VERSION }}-${{
            hashFiles('crates/*/src/**', 'crates/*/Cargo.toml', 'vendor/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install the pinned Rust toolchain
        if: steps.parser.outputs.cache-hit != 'true'
        run: rustup show active-toolchain

      - name: Cache cargo
        if: steps.parser.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        if: steps.parser.outputs.cache-hit != 'true'
        run: |
          if ! command -v wasm-pack >/dev/null; then
            cargo install wasm-pack --locked --version "$WASM_PACK_VERSION"
          fi

      - name: wasm:build
        if: steps.parser.outputs.cache-hit != 'true'
        run: bun run wasm:build

      - name: build
        run: bun run build

      - name: deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          command: deploy

      - name: smoke
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYED_URL" ]; then
            echo "wrangler-action returned no deployment-url; nothing to smoke test." >&2
            exit 1
          fi
          bun run smoke "$DEPLOYED_URL"
