[workspace]
members = ["crates/demo-parser", "crates/demo-parser-wasm"]
# `vendor/parser` declares its own `[workspace]`, which is what actually keeps upstream code out of
# `cargo fmt --all` and `cargo clippy --workspace` — `exclude` alone does not, because a path
# dependency is a member whatever `exclude` says. This line is what makes the nested root legal:
# without it cargo refuses with "multiple workspace roots found in the same workspace".
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
ahash = "0.8"
demo-parser = { path = "crates/demo-parser" }
parser = { path = "vendor/parser" }
thiserror = "2.0.18"
wasm-bindgen = "0.2.106"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Size is a shipped budget, not a preference: AGENTS.md §16 caps the binary at 4 MB and CI fails
# above 24 MB. `wasm32-unknown-unknown` aborts on panic regardless, so unwinding only costs bytes.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
