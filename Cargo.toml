[workspace]
members = ["crates/demo-parser", "crates/demo-parser-wasm"]
# `vendor/parser` declares its own `[workspace]`, which is what actually keeps upstream code out of
# `cargo fmt --all` and `cargo clippy --workspace` — `exclude` alone does not, because a path
# dependency is a member whatever `exclude` says. This line is what makes the nested root legal:
# without it cargo refuses with "multiple workspace roots found in the same workspace".
exclude = ["vendor"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
ahash = "0.8"
# `bzip2` defaults to `libbz2-rs-sys`, a Rust rewrite rather than the C bindings the crate is named
# for, so `AGENTS.md` §7.1 gets its pure-Rust decoder without a C toolchain in the wasm build.
bzip2 = "0.6.1"
demo-parser = { path = "crates/demo-parser" }
js-sys = "0.3.103"
parser = { path = "vendor/parser" }
csgoproto = { path = "vendor/csgoproto" }
ruzstd = "0.9.0"
thiserror = "2.0.18"
wasm-bindgen = "0.2.106"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# `opt-level = 3` because §16 budgets two things at once and only this setting holds both. #59
# measured the shipped `-Oz` binary at 18.85 s on the 264 MB container against a 15 s budget, and
# `-O3` at 14.19 s for 0.40 MB more binary — spending a cap that had 45% of itself unused to buy the
# one that had none. Size is still a budget and not a preference, which is why the flags below are
# named rather than defaulted; it is no longer the setting this line is chosen from.
# `wasm32-unknown-unknown` aborts on panic regardless, so unwinding only costs bytes.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
