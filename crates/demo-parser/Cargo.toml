[package]
name = "demo-parser"
description = "Demo parsing core. Host-testable, no WASM toolchain, no JS bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ahash.workspace = true
bzip2.workspace = true
# Upstream's own item table, already in the graph through `parser`: WEAPINDICIES is the only
# vocabulary this crate can name without recalling a list it has never read. No bundle cost.
csgoproto.workspace = true
parser.workspace = true
ruzstd.workspace = true
thiserror.workspace = true

# Test-only, and never linked into the wasm binary: the golden snapshots AGENTS.md section 18 asks
# for are JSON. `serde` is already in the graph through `parser`.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
