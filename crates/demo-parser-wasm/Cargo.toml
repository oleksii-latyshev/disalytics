[package]
name = "demo-parser-wasm"
description = "Thin wasm-bindgen wrapper over demo-parser. Bindings only, no parsing logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# `js-sys` adds no crate to the graph — the `getrandom` opt-ins below already link it. It is named
# here because the parsed demo is handed over as plain JavaScript objects and typed arrays the
# worker can transfer, which is a boundary concern and belongs on this side of it.
[dependencies]
demo-parser.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true

# Two `getrandom` majors coexist in the parser's tree — 0.2 through `rand`, 0.3 through `ahash` —
# and each refuses to build for `wasm32-unknown-unknown` until its browser backend is opted into
# (`docs/PARSER.md` §8). Both opt-ins pull `wasm-bindgen` and `js-sys`, which is why they sit here
# and not in `crates/demo-parser`: hard rule 12 keeps that crate free of JS bindings so it can
# still compile for a native Tauri build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[lints]
workspace = true

# wasm-opt starts from the MVP feature set, while rustc 1.97 emits the 2024 `wasm32-unknown-unknown`
# baseline — validation fails on `memory.copy` alone unless the producer's features are named back.
# Every flag must exist in the *older* binaryen wasm-pack downloads when none is on PATH, not only
# in a current local one: `--enable-bulk-memory-opt` is rejected there, and is redundant anyway
# because `--enable-bulk-memory` already covers `memory.copy` and `memory.fill`.
# `-O3` rather than wasm-pack's default `-O`, and matching `opt-level` in the root `Cargo.toml`:
# #59 measured the two settings against both §16 budgets at once and `-O3` is the only one that
# meets the parse-time budget, for 0.40 MB of a 4 MB cap that had 45% of itself unused (#66).
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-bulk-memory",
  "--enable-mutable-globals",
  "--enable-multivalue",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
  "--enable-sign-ext",
]
